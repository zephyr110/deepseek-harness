# The dsh-desktop app config: the base harness graph plus desktop host rows.
# The Electron main process carries the client transport over IPC instead of
# HTTP, so webserver-bound rows from the web profile are deliberately absent.
# The base layer (the `include: [@deepseek-ai/dsh-base]` of the plan's config)
# is applied by startDesktopHost() as the boot patch layer — the same bundle
# patch the profile loader applies — because this file's Loader dialect is a
# plain entry list. `hmr` is disabled there too, matching the web surface.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js dshHomePath('storages')

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: message-feedback
  name: '@deepseek-ai/dsh-message-feedback'
  config:
    maxNoteBytes: 8192

- id: session-log-download
  name: '@deepseek-ai/dsh-session-log-export'

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

- id: session-projection-cache
  name: '@deepseek-ai/dsh-session-projection-cache'
  config:
    writeEveryEvents: 200
    writeIntervalMs: 5000

- id: api-proxy
  name: '@deepseek-ai/dsh-host-apiproxy'

# ── the web profile's other host rows that do not depend on webServer ──────

- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

# Whole-log turn/step counts for the chat stats strip (the sessionStats
# projection key); the projection registry itself is a base-layer row.
- id: session-stats
  name: '@deepseek-ai/dsh-session-stats'

# The desktop operator always sits at the host screen, so the native backend
# is mounted directly; the web's adaptive chooser row is webserver-bound.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-native'

# Read-only projection of current Loader entries for trusted client RPCs.
- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'

- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'
